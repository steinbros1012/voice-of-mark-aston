<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <!-- Background -->
  <rect width="200" height="200" rx="36" fill="#0A2040"/>

  <!-- Microphone body (capsule) -->
  <rect x="80" y="28" width="40" height="72" rx="20" fill="#E87722"/>

  <!-- Microphone grille lines -->
  <line x1="80" y1="60" x2="120" y2="60" stroke="#03101E" stroke-width="2.5" stroke-opacity="0.35"/>
  <line x1="80" y1="72" x2="120" y2="72" stroke="#03101E" stroke-width="2.5" stroke-opacity="0.35"/>
  <line x1="80" y1="84" x2="120" y2="84" stroke="#03101E" stroke-width="2.5" stroke-opacity="0.35"/>

  <!-- Stand arc -->
  <path d="M60 100 C60 140 140 140 140 100" stroke="#E87722" stroke-width="8" stroke-linecap="round" fill="none"/>

  <!-- Stand pole -->
  <line x1="100" y1="140" x2="100" y2="168" stroke="#E87722" stroke-width="8" stroke-linecap="round"/>

  <!-- Base -->
  <line x1="72" y1="168" x2="128" y2="168" stroke="#E87722" stroke-width="8" stroke-linecap="round"/>
</svg>
